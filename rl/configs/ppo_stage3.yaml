# Run: python -m rl.train --config rl/configs/ppo_stage3.yaml
init_from: models/ppo_v1_best.zip    
seed: 1
n_envs: 4
total_timesteps: 800000
learning_rate: 0.0001     
n_steps: 512
batch_size: 256
n_epochs: 10
gamma: 1.0
gae_lambda: 0.95
ent_coef: 0.005
hidden: 64
size_mix:                     
  - [10, 10, 0.25]
  - [12, 12, 0.25]
  - [15, 15, 0.2]
  - [20, 10, 0.2]
  - [20, 15, 0.1]
pad_jobs: 32
n_val: 30
val_seed: 777
eval_freq: 50000
save_path: models/ppo_v2.zip